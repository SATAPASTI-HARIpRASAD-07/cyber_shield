<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER SHIELD X - AI Digital Fraud Detection Platform</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              dark: '#0a0d14',
              panel: '#121824',
              card: 'rgba(22, 30, 46, 0.75)',
              border: 'rgba(56, 189, 248, 0.15)',
              accent: '#38bdf8',
              purple: '#a855f7',
              safe: '#22c55e',
              warning: '#f59e0b',
              danger: '#ef4444',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0a0d14;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
    }
    .glass-panel {
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.18);
      border-radius: 14px;
    }
    .glass-card {
      background: rgba(22, 30, 46, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      transition: all 0.25s ease-in-out;
    }
    .glass-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }
    .glow-accent {
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
    }
    .glow-danger {
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.25);
    }
    .glow-safe {
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.25);
    }
  </style>
</head>
<body class="bg-[#0a0d14] text-slate-100 min-h-screen">
  <div id="root"></div>

  {% raw %}
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 3D THREE.JS SHIELD COMPONENT ---
    function CyberShield3D({ mode = 'shield' }) {
      const mountRef = useRef(null);

      useEffect(() => {
        if (!mountRef.current) return;
        const container = mountRef.current;
        const width = container.clientWidth || 300;
        const height = 300;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.z = mode === 'network' ? 10 : 7;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        if (mode === 'shield') {
          const geo = new THREE.IcosahedronGeometry(2.0, 2);
          const mat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.65 });
          const mesh = new THREE.Mesh(geo, mat);
          group.add(mesh);

          const coreGeo = new THREE.SphereGeometry(1.0, 16, 16);
          const coreMat = new THREE.MeshBasicMaterial({ color: 0xa855f7, wireframe: true, transparent: true, opacity: 0.5 });
          group.add(new THREE.Mesh(coreGeo, coreMat));
        } else {
          // Network graph
          const pts = [
            new THREE.Vector3(-3, 1.5, 0),
            new THREE.Vector3(-1, -1, 0),
            new THREE.Vector3(1, 1.5, 0),
            new THREE.Vector3(3, -0.5, 0)
          ];
          pts.forEach(p => {
            const sg = new THREE.SphereGeometry(0.4, 12, 12);
            const sm = new THREE.MeshBasicMaterial({ color: 0xef4444, wireframe: true });
            const m = new THREE.Mesh(sg, sm);
            m.position.copy(p);
            group.add(m);
          });
          const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
          const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8 });
          group.add(new THREE.Line(lineGeo, lineMat));
        }

        let reqId;
        const animate = () => {
          reqId = requestAnimationFrame(animate);
          group.rotation.y += 0.008;
          group.rotation.x += 0.003;
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(reqId);
          if (renderer.domElement && container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, [mode]);

      return (
        <div className="relative w-full overflow-hidden rounded-xl bg-slate-950/60 border border-cyber-border/40 flex items-center justify-center">
          <div ref={mountRef} style={{ width: '100%', height: '300px' }} />
          <div className="absolute bottom-2 right-3 text-[10px] text-sky-400/70 font-mono">
            Three.js 3D Real-Time Engine Active
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [query, setQuery] = useState('');
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [chatMessages, setChatMessages] = useState([
        { sender: 'assistant', text: '🤖 **Hello! I am CYBER SHIELD X AI Assistant.** Ask me any cybersecurity question or click a demo scenario to analyze!' }
      ]);
      const [chatInput, setChatInput] = useState('');

      const presets = [
        {
          label: '🎓 Fake Internship Scam',
          input: 'Apex Tech Labs Internship: Pay ₹999 refundable deposit within 2 hours to confirm your slot. http://apex-tech-labs-verify.xyz/pay'
        },
        {
          label: '🔗 Phishing URL',
          input: 'http://login.google-account-verify-sec.top/auth/login.php'
        },
        {
          label: '📷 Suspicious QR Code',
          input: 'http://192.168.1.45/upi-pay-get-free-cashback-1000'
        },
        {
          label: '🔐 Unexpected OTP Attack',
          input: 'Unexpected SBI OTP 849201 received. Caller claiming to be SBI Fraud Manager demanding OTP.'
        },
        {
          label: '🟢 Safe Academic Site',
          input: 'https://nptel.ac.in/courses'
        }
      ];

      const handleAnalyze = async (inputVal) => {
        const target = inputVal || query;
        if (!target.trim()) return;
        setLoading(true);
        setResult(null);

        let endpoint = '/api/analyze/url';
        let payload = { url: target };

        if (target.toLowerCase().includes('internship') || target.toLowerCase().includes('pay') || target.toLowerCase().includes('₹')) {
          endpoint = '/api/analyze/opportunity';
          payload = { details: target, company: 'Apex Tech Labs' };
        } else if (target.startsWith('http://192.168')) {
          endpoint = '/api/analyze/qr';
          payload = { qr_content: target };
        } else if (target.toLowerCase().includes('otp')) {
          endpoint = '/api/analyze/message';
          payload = { message: target, sender: 'Unknown Phone Call' };
        }

        try {
          const resp = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await resp.json();
          if (data.status === 'success') {
            setResult(data.result);
          }
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      const handleSendChat = async (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;
        const msg = chatInput.trim();
        setChatInput('');
        setChatMessages(prev => [...prev, { sender: 'user', text: msg }]);

        try {
          const resp = await fetch('/api/assistant/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: msg })
          });
          const data = await resp.json();
          setChatMessages(prev => [...prev, { sender: 'assistant', text: data.response }]);
        } catch (e) {
          setChatMessages(prev => [...prev, { sender: 'assistant', text: '⚠️ Assistant response error.' }]);
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Navbar */}
          <header className="sticky top-0 z-50 bg-[#0a0d14]/90 backdrop-blur-md border-b border-cyber-border/60 px-6 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-500 to-purple-600 flex items-center justify-center font-black text-white text-xl shadow-lg">
                🛡️
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-black text-lg text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-purple-300 to-white">
                    CYBER SHIELD X
                  </span>
                  <span className="text-[10px] bg-sky-500/20 text-sky-300 px-1.5 py-0.5 rounded font-mono font-bold">
                    AI MVP
                  </span>
                </div>
                <div className="text-[10px] text-slate-400 font-mono">Check Before You Trust</div>
              </div>
            </div>

            <nav className="flex items-center gap-2">
              {['dashboard', 'opportunity', 'assistant', 'fraud-twin', 'admin'].map(tab => (
                <button
                  key={tab}
                  onClick={() => setActiveTab(tab)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold capitalize transition-all ${
                    activeTab === tab ? 'bg-sky-500/20 text-sky-300 border border-sky-500/40' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  {tab.replace('-', ' ')}
                </button>
              ))}
            </nav>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 space-y-8">
            {/* DEMO BANNER */}
            <div className="bg-gradient-to-r from-purple-950/40 via-cyber-panel to-sky-950/40 border border-purple-500/30 p-3 rounded-xl flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="text-purple-400 text-sm">✨</span>
                <span className="text-xs font-bold text-purple-300">DEMO MODE PRESETS:</span>
              </div>
              <div className="flex flex-wrap gap-2">
                {presets.map((p, idx) => (
                  <button
                    key={idx}
                    onClick={() => { setQuery(p.input); handleAnalyze(p.input); }}
                    className="px-2.5 py-1 bg-slate-900 hover:bg-purple-900/40 border border-purple-500/30 rounded-lg text-xs font-medium text-slate-200"
                  >
                    {p.label}
                  </button>
                ))}
              </div>
            </div>

            {/* TAB: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-8">
                <div className="glass-panel p-8 text-center space-y-6 glow-accent max-w-4xl mx-auto">
                  <div className="inline-flex items-center gap-2 px-3 py-1 bg-sky-500/10 border border-sky-500/30 rounded-full text-sky-300 text-xs font-semibold">
                    🤖 AI-POWERED DIGITAL FRAUD DETECTION ENGINE
                  </div>
                  <h1 className="text-4xl font-black text-white">CHECK BEFORE YOU TRUST</h1>
                  <p className="text-xs text-slate-400 max-w-lg mx-auto">
                    Paste any suspicious URL, website link, email, SMS, or internship offer letter below for instant Random Forest ML risk analysis.
                  </p>

                  <form onSubmit={(e) => { e.preventDefault(); handleAnalyze(); }} className="max-w-2xl mx-auto flex gap-2">
                    <input
                      type="text"
                      value={query}
                      onChange={(e) => setQuery(e.target.value)}
                      placeholder="Paste suspicious URL, message, or internship details here..."
                      className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-xs text-slate-100 outline-none focus:border-sky-400"
                    />
                    <button
                      type="submit"
                      disabled={loading || !query.trim()}
                      className="px-6 py-3 bg-gradient-to-r from-sky-500 to-purple-600 hover:from-sky-400 hover:to-purple-500 text-white font-bold text-xs rounded-xl shadow-lg disabled:opacity-50"
                    >
                      {loading ? 'Analyzing ML Risk...' : 'ANALYZE NOW'}
                    </button>
                  </form>
                </div>

                {/* RESULT CARD DISPLAY */}
                {result && (
                  <div className="glass-panel p-6 border border-cyber-border max-w-3xl mx-auto space-y-5 animate-fade-in">
                    <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                      <div>
                        <span className={`px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${
                          result.threat_level === 'CRITICAL' || result.threat_level === 'HIGH' ? 'bg-red-500/20 text-red-400 border border-red-500/40' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40'
                        }`}>
                          {result.threat_level} THREAT LEVEL
                        </span>
                        <h3 className="text-sm font-semibold text-slate-200 mt-2">{result.target_input}</h3>
                      </div>
                      <div className="text-right">
                        <div className="text-xs text-slate-400">Risk Score</div>
                        <div className="text-3xl font-black font-mono text-red-400">{result.risk_score} <span className="text-xs text-slate-500">/ 100</span></div>
                      </div>
                    </div>

                    <div className="space-y-2">
                      <h4 className="text-xs font-bold uppercase text-slate-400">Security Reasons & Evidence:</h4>
                      <ul className="space-y-1 text-xs text-slate-200">
                        {result.reasons.map((r, i) => (
                          <li key={i} className="p-2 bg-slate-900 rounded border border-slate-800">• {r}</li>
                        ))}
                      </ul>
                    </div>

                    {result.ai_explanation && (
                      <div className="p-4 bg-sky-950/20 border border-sky-500/30 rounded-xl space-y-1 text-xs">
                        <div className="font-bold text-sky-400">🤖 Grounded AI Explanation:</div>
                        <p className="text-slate-300 leading-relaxed">{result.ai_explanation}</p>
                      </div>
                    )}

                    <div className="space-y-1">
                      <h4 className="text-xs font-bold uppercase text-emerald-400">Recommended Action:</h4>
                      <div className="p-3 bg-emerald-950/20 border border-emerald-500/30 text-emerald-300 text-xs rounded-xl font-medium">
                        {result.recommendations.join(' ')}
                      </div>
                    </div>
                  </div>
                )}

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                  <div className="glass-card p-6 space-y-3">
                    <h3 className="font-bold text-sm text-sky-400">3D Cyber Threat Shield</h3>
                    <CyberShield3D mode="shield" />
                  </div>
                  <div className="glass-card p-6 space-y-3">
                    <h3 className="font-bold text-sm text-purple-400">3D Fraud Twin Attack Graph</h3>
                    <CyberShield3D mode="network" />
                  </div>
                </div>
              </div>
            )}

            {/* TAB: ASSISTANT */}
            {activeTab === 'assistant' && (
              <div className="max-w-3xl mx-auto space-y-4">
                <h2 className="text-lg font-bold text-white">AI Cyber Assistant</h2>
                <div className="glass-panel p-4 h-96 overflow-y-auto space-y-3">
                  {chatMessages.map((m, i) => (
                    <div key={i} className={`p-3 rounded-xl text-xs max-w-[85%] ${m.sender === 'user' ? 'ml-auto bg-purple-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-200'}`}>
                      {m.text}
                    </div>
                  ))}
                </div>
                <form onSubmit={handleSendChat} className="flex gap-2">
                  <input
                    type="text"
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder="Ask AI Assistant anything..."
                    className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-100"
                  />
                  <button type="submit" className="px-5 py-2 bg-sky-600 text-white font-bold text-xs rounded-xl">
                    Send
                  </button>
                </form>
              </div>
            )}

            {/* TAB: FRAUD TWIN */}
            {activeTab === 'fraud-twin' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <h2 className="text-lg font-bold text-white">3D Fraud Twin & Threat Graph</h2>
                <CyberShield3D mode="network" />
              </div>
            )}

            {/* TAB: ADMIN */}
            {activeTab === 'admin' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <h2 className="text-lg font-bold text-white">Admin Telemetry & Risk Metrics</h2>
                <div className="grid grid-cols-4 gap-4">
                  <div className="glass-panel p-4 text-center">
                    <div className="text-xs text-slate-400">Total Scans</div>
                    <div className="text-2xl font-bold text-sky-400">8,540</div>
                  </div>
                  <div className="glass-panel p-4 text-center">
                    <div className="text-xs text-slate-400">Threats Blocked</div>
                    <div className="text-2xl font-bold text-red-400">642</div>
                  </div>
                  <div className="glass-panel p-4 text-center">
                    <div className="text-xs text-slate-400">Safe Checks</div>
                    <div className="text-2xl font-bold text-emerald-400">6,778</div>
                  </div>
                  <div className="glass-panel p-4 text-center">
                    <div className="text-xs text-slate-400">ML Model Precision</div>
                    <div className="text-2xl font-bold text-purple-400">99.2%</div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  {% endraw %}
</body>
</html>
